[package]
name = "desktop"
version = "0.3.0"
description = "LiveUse desktop"
authors = ["LiveUse"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["sync", "time", "macros", "net", "rt"] }
tauri-plugin-global-shortcut = "2.4.0"
axum = "0.8.9"
serialport = "4.10.1"
base64 = "0.23.1"
rand = "0.10.3"
futures = "0.3"
xcap = "0.9.8"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rig = "0.44"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"

# Screenshots run image resize and encode in every agent step; unoptimized they take seconds.
[profile.dev.package."*"]
opt-level = 3


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
