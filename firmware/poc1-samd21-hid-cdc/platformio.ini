; POC1 — XIAO SAMD21 USB composite HID mouse + CDC serial
; FreeRTOS: named CDC recv task + HID motion task + command queue
;
; Board: Seeeduino XIAO / XIAO SAMD21 (ATSAMD21G18A)
; Stack: Seeed Arduino core TinyUSB (USE_TINYUSB) + Seeed FreeRTOS

[env:seeed_xiao]
platform = atmelsam
board = seeed_xiao
framework = arduino
monitor_speed = 115200
lib_archive = no
lib_ignore = USBHost
lib_deps =
  https://github.com/Seeed-Studio/Seeed_Arduino_FreeRTOS.git
build_flags =
  -DUSE_TINYUSB
  -DPOC1_BOARD_SAMD21=1
  ; Fix include path for Adafruit_USBD_CDC.h (Seeed core TinyUSB layout)
  -I${PROJECT_CORE_DIR}/packages/framework-arduino-samd-seeed/libraries/Adafruit_TinyUSB_Arduino/src/arduino
  ; Seeed FreeRTOS redefines yield(); Arduino core also defines it (non-weak).
  ; Prefer FreeRTOS yield + dedicated tinyusb_task() for USB pumping.
  -Wl,--allow-multiple-definition
