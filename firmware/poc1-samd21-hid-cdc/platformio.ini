; POC1 — XIAO SAMD21 USB composite HID mouse + CDC serial
; Arduino loop: CDC line commands drive smooth HID motion
;
; Board: Seeeduino XIAO / XIAO SAMD21 (ATSAMD21G18A)
; Stack: Seeed Arduino core TinyUSB (USE_TINYUSB)

[env:seeed_xiao]
platform = atmelsam
board = seeed_xiao
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/settle_upload.py
lib_archive = no
lib_ignore = USBHost
build_flags =
  -DUSE_TINYUSB
  -DPOC1_BOARD_SAMD21=1
  ; Fix include path for Adafruit_USBD_CDC.h (Seeed core TinyUSB layout)
  -I${PROJECT_CORE_DIR}/packages/framework-arduino-samd-seeed/libraries/Adafruit_TinyUSB_Arduino/src/arduino
