; Live Use — XIAO SAMD21 USB composite HID mouse + keyboard + CDC serial
; Arduino loop: CDC line commands drive smooth HID motion
;
; Board: Seeeduino XIAO / XIAO SAMD21 (ATSAMD21G18A)
; Stack: Seeed Arduino core TinyUSB (USE_TINYUSB)

[env:seeed_xiao]
platform = atmelsam
board = seeed_xiao
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem*
extra_scripts =
  pre:scripts/settle_upload.py
  post:scripts/settle_upload.py
lib_archive = no
lib_ignore = USBHost
build_flags =
  -Iinclude
  -DUSE_TINYUSB
  -DPOC1_BOARD_SAMD21=1
  -Wl,--wrap=tud_hid_descriptor_report_cb
  ; Fix include path for Adafruit_USBD_CDC.h (Seeed core TinyUSB layout)
  -I${PROJECT_CORE_DIR}/packages/framework-arduino-samd-seeed/libraries/Adafruit_TinyUSB_Arduino/src/arduino
